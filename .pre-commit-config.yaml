repos:
  - repo: local
    hooks:
      # 1. Formatage (Ruff)
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]

      # 2. Analyse du code (Ruff)
      - id: ruff-lint
        name: ruff-lint
        entry: uv run ruff check --fix
        language: system
        types: [python]

      # 3. Vérification des types (Mypy)
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        types: [python]
        pass_filenames: false

      # 4. Exécution des tests unitaires (Pytest)
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        
  # ---------------------------------------------------------------------------
  # 🔒 Sécurité : Détection des secrets et fuites de clés API
  # ---------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ---------------------------------------------------------------------------
  # 🛠️ Vérifications de base (Syntaxe & Fichiers sensibles)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      # Empêche de commiter accidentellement des fichiers .env privés
      - id: detect-private-key